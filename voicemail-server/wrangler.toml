name = "caller-voicemail"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Same D1 database as the P2P name server (this Worker only uses the voicemails table).
[[d1_databases]]
binding = "DB"
database_name = "caller-p2p"
database_id = "cce5bd7b-2e9f-4504-af0a-13c6b0137d63"

# No phone number or key is kept in this file (it is in a public repository). The owner's key is the Worker secret
# VOICEMAIL_KEY: `npx wrangler secret put VOICEMAIL_KEY`.
