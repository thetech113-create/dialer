name: Build signed APK

# Builds and signs the release APK on GitHub's runners (which have the Android SDK and full
# network access) and uploads it as a downloadable artifact. Runs on every push to the work
# branches and whenever started by hand from the Actions tab.
#
# One-time setup — add these four repository secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   CALLER_KEYSTORE_BASE64    base64 of your caller-release.jks  (see "Create the secrets" below)
#   CALLER_KEYSTORE_PASSWORD  the keystore password
#   CALLER_KEY_ALIAS          the key alias (e.g. caller)
#   CALLER_KEY_PASSWORD       the key password
#
# Create the secrets (on your own machine, where the keystore lives):
#   keytool -genkeypair -v -keystore caller-release.jks -alias caller \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -dname "CN=Caller, OU=Caller, O=Caller, L=City, ST=State, C=IN"
#   base64 -w0 caller-release.jks > caller-release.jks.b64     # macOS: base64 -i caller-release.jks -o caller-release.jks.b64
# Then paste the .b64 contents into CALLER_KEYSTORE_BASE64 and set the three password/alias secrets.
# Keep caller-release.jks and its password backed up safely and out of git.

on:
  push:
    branches:
      - main
      - ccr-7a21bc3e-i91bll
    paths-ignore:
      - 'release/**'
      - '*.apk'
      - '**/*.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fail early if signing secrets are missing
        env:
          CALLER_KEYSTORE_BASE64: ${{ secrets.CALLER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CALLER_KEYSTORE_BASE64" ]; then
            echo "::error::CALLER_KEYSTORE_BASE64 is not set. Add the signing secrets (see the header of this workflow) so the APK is release-signed, not debug-signed."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platform-tools" "platforms;android-36"

      - name: Decode release keystore
        env:
          CALLER_KEYSTORE_BASE64: ${{ secrets.CALLER_KEYSTORE_BASE64 }}
        run: |
          echo "$CALLER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/caller-release.jks"
          echo "Keystore written ($(stat -c%s "$RUNNER_TEMP/caller-release.jks") bytes)"

      - name: Read version name
        id: ver
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Build release APK
        env:
          CALLER_KEYSTORE: ${{ runner.temp }}/caller-release.jks
          CALLER_KEYSTORE_PASSWORD: ${{ secrets.CALLER_KEYSTORE_PASSWORD }}
          CALLER_KEY_ALIAS: ${{ secrets.CALLER_KEY_ALIAS }}
          CALLER_KEY_PASSWORD: ${{ secrets.CALLER_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify it is NOT debug-signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          OWNER=$(keytool -printcert -jarfile "$APK" | grep -m1 'Owner:' || true)
          echo "$OWNER"
          if echo "$OWNER" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is debug-signed - signing secrets were not applied."
            exit 1
          fi
          sha256sum "$APK"

      - name: Stage named APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Caller-${{ steps.ver.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caller-${{ steps.ver.outputs.name }}
          path: out/Caller-${{ steps.ver.outputs.name }}.apk
          if-no-files-found: error
