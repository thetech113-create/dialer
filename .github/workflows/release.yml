name: Publish release

# Builds + signs the release APK, then publishes a GitHub Release with the APK and an update.json
# asset attached in the exact shape the in-app updater reads
# ({"versionCode","versionName","apkAsset","sha256"}). The app reads ONLY this release asset; the
# repo's release/update.json is bookkeeping (kept in sync best-effort at the end).
#
# How to cut a release:
#   1. Bump versionCode + versionName in app/build.gradle.kts and commit.
#   2. Tag that commit and push the tag, e.g.:
#        git tag v8.10.114 && git push origin v8.10.114
#      (or run this workflow by hand from the Actions tab - it then tags the current commit).
#   The tag must match versionName in app/build.gradle.kts, and the commit must contain the
#   release-signing setup (v8.10.114+). Needs the same four signing secrets as build-apk.yml.
#
# NOTE: moving from the old debug-signed builds (<= v8.10.113) to the first release-signed build is a
# one-time manual uninstall + reinstall on each device - the in-app updater cannot change signing keys.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail early if signing secrets are missing
        env:
          CALLER_KEYSTORE_BASE64: ${{ secrets.CALLER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CALLER_KEYSTORE_BASE64" ]; then
            echo "::error::CALLER_KEYSTORE_BASE64 is not set. Add the signing secrets (see build-apk.yml) before publishing a release."
            exit 1
          fi

      - name: Resolve version
        id: ver
        run: |
          GRADLE_VER=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          GRADLE_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VER" != "$GRADLE_VER" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $GRADLE_VER in app/build.gradle.kts."
              exit 1
            fi
          fi
          echo "name=$GRADLE_VER" >> "$GITHUB_OUTPUT"
          echo "code=$GRADLE_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$GRADLE_VER" >> "$GITHUB_OUTPUT"
          echo "Version $GRADLE_VER (code $GRADLE_CODE)"

      - name: Abort if the release already exists
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.ver.outputs.tag }} already exists. Bump the version before publishing."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Decode release keystore
        env:
          CALLER_KEYSTORE_BASE64: ${{ secrets.CALLER_KEYSTORE_BASE64 }}
        run: echo "$CALLER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/caller-release.jks"

      - name: Build release APK
        env:
          CALLER_KEYSTORE: ${{ runner.temp }}/caller-release.jks
          CALLER_KEYSTORE_PASSWORD: ${{ secrets.CALLER_KEYSTORE_PASSWORD }}
          CALLER_KEY_ALIAS: ${{ secrets.CALLER_KEY_ALIAS }}
          CALLER_KEY_PASSWORD: ${{ secrets.CALLER_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK (not debug-signed, right version)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          OWNER=$(keytool -printcert -jarfile "$APK" | grep -m1 'Owner:' || true)
          echo "$OWNER"
          if echo "$OWNER" | grep -q 'CN=Android Debug'; then
            echo "::error::APK is debug-signed - signing secrets were not applied."
            exit 1
          fi

      - name: Assemble release assets (APK + update.json)
        id: assets
        run: |
          mkdir -p out
          VER='${{ steps.ver.outputs.name }}'
          CODE='${{ steps.ver.outputs.code }}'
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "out/Caller-$VER.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "%s", "apkAsset": "Caller-%s.apk", "sha256": "%s"}\n' \
            "$CODE" "$VER" "$VER" "$SHA" > out/update.json
          echo "update.json:"; cat out/update.json
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Release notes from the commit
        id: notes
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          BODY=$(echo "$SUBJECT" | sed -E 's/^Release v[0-9.]+: *//')
          [ -z "$BODY" ] && BODY="Release ${{ steps.ver.outputs.tag }}"
          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          TARGET_ARGS=""
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TARGET_ARGS="--target $GITHUB_SHA"
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.body }}" \
            $TARGET_ARGS \
            "out/Caller-${{ steps.ver.outputs.name }}.apk" \
            "out/update.json"

      - name: Sync repo release/update.json (bookkeeping, best effort)
        continue-on-error: true
        run: |
          DEFAULT=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          CUR_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/release/update.json?ref=$DEFAULT" --jq .sha 2>/dev/null || echo "")
          CONTENT=$(base64 -w0 out/update.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/release/update.json" \
            -f message="Update release/update.json for ${{ steps.ver.outputs.tag }} [skip ci]" \
            -f content="$CONTENT" \
            -f branch="$DEFAULT" \
            ${CUR_SHA:+-f sha="$CUR_SHA"}

      - name: Summary
        run: |
          echo "### Published ${{ steps.ver.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: Caller-${{ steps.ver.outputs.name }}.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- sha256: \`${{ steps.assets.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
