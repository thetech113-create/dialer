name: Build test APK (debug-signed)

# A quick, debug-signed build for testing app behaviour (e.g. the keypad fix). Needs NO signing
# secrets. It is NOT the Play Protect fix: a debug-signed APK is still flagged by Play Protect, and
# because its key differs from any existing install you must uninstall the current app first.
# For the real, release-signed build use release.yml (which needs the signing secrets).

on:
  push:
    branches:
      - ccr-7a21bc3e-i91bll
      - main
    paths:
      - 'app/**'
      - '.github/workflows/test-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36"

      - name: Read version name
        id: ver
        run: echo "name=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage named APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Caller-${{ steps.ver.outputs.name }}-test.apk"

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Caller-${{ steps.ver.outputs.name }}-test
          path: out/Caller-${{ steps.ver.outputs.name }}-test.apk
          if-no-files-found: error

      - name: Publish to the 'test-build' prerelease (direct download link)
        run: |
          APK="out/Caller-${{ steps.ver.outputs.name }}-test.apk"
          NOTES="Debug-signed TEST build of v${{ steps.ver.outputs.name }}. Not the Play Protect fix (still debug-signed, Play Protect will warn). Different key from any existing install, so uninstall the current app first, then install this. For the real signed build see the normal releases."
          if ! gh release view test-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create test-build \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Test build (debug-signed)" \
              --notes "$NOTES"
          else
            gh release edit test-build --repo "$GITHUB_REPOSITORY" --notes "$NOTES" --prerelease
          fi
          gh release upload test-build "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/test-build/Caller-${{ steps.ver.outputs.name }}-test.apk" >> "$GITHUB_STEP_SUMMARY"
